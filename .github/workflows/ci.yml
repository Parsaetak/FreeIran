name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    env:
      # Never silently auto-switch toolchains: the pinned setup-go
      # version must satisfy go.mod exactly or the job fails loudly.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache: true

      # §26: fail loudly on version drift between the synced sources
      # (VERSION, frontend/package.json, internal/version, and the
      # Windows resource definition build/winres.json that produces
      # cmd/freeiran/*.syso). release.yml re-checks against the git
      # tag at release time.
      - name: Version consistency
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=$version"
          grep -q "\"version\": \"$version\"" frontend/package.json ||
            { echo "frontend/package.json version != $version" >&2; exit 1; }
          grep -q "var Version = \"$version\"" internal/version/version.go ||
            { echo "internal/version/version.go != $version" >&2; exit 1; }
          # winres.json carries the version in several places; every
          # version literal in it must be the current version (a
          # stale resource made v0.9.8.6/0.9.8.7 ship 0.9.8.5 PE
          # version metadata). The PE metadata legitimately uses the
          # 4-part form ("$version.0"), so exactly two spellings are
          # accepted: the VERSION itself and its 4-part zero-patch
          # expansion — anything else (any other patch, any other
          # series) fails the job. (v0.9.9: the old single-regex check
          # hard-coded the 0.9 series and broke on 3-part versions
          # with a 4-part PE form.)
          bad=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?' build/winres.json |
            sort -u | grep -vx "$version" | grep -vx "$version.0" || true)
          if [ -n "$bad" ]; then
            echo "build/winres.json carries stale version(s): $bad (want $version or $version.0 only)" >&2
            exit 1
          fi

      # The Wails toolchain pair must be semantically IDENTICAL: the Go
      # module reports "v3.0.0-beta.19" while npm reports "3.0.0-beta.19"
      # — the leading "v" is Go module notation, not version drift.
      # Normalization strips exactly one optional leading "v" from each
      # side before comparison; a real mismatch (different numbers or
      # prerelease) still fails the job. The lockfile must resolve the
      # SAME runtime version the package.json declares: the ByID call
      # hashes are toolchain-version-coupled, so mismatched betas can
      # break the runtime call surface silently.
      - name: Wails toolchain pair consistency
        run: |
          normalize() { sed 's/^[vV]//'; }
          go_wails=$(go list -m github.com/wailsapp/wails/v3 |
            awk '{print $2}' | normalize)
          js_wails=$(node -e \
            "console.log(require('./frontend/package.json').dependencies['@wailsio/runtime'])" |
            normalize)
          echo "go: $go_wails  js: $js_wails"
          if [ "$go_wails" != "$js_wails" ]; then
            echo "Wails version drift: go.mod v$go_wails vs package.json $js_wails" >&2
            exit 1
          fi
          locked=$(node -e \
            "console.log(require('./frontend/package-lock.json').packages['node_modules/@wailsio/runtime'].version)" |
            normalize)
          echo "lockfile: $locked"
          if [ "$locked" != "$js_wails" ]; then
            echo "package-lock.json resolves @wailsio/runtime $locked, not $js_wails" >&2
            exit 1
          fi

      - name: Format check
        run: |
          unformatted=$(gofmt -l ./engine ./system ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build deterministic fake test cores
        run: |
          # The test matrix runs against controlled fake protocol-core
          # executables, never real VPN binaries and never whatever
          # happens to be in the runner's PATH. The fixture directory is
          # exposed through FREEIRAN_TEST_CORES (engine/core/contract
          # consumes it; a missing fixture is a hard failure).
          mkdir -p "$RUNNER_TEMP/freeiran-test-cores"
          go build -o "$RUNNER_TEMP/freeiran-test-cores/fakecore" ./engine/core/testdata/fakecore
          cp "$RUNNER_TEMP/freeiran-test-cores/fakecore" "$RUNNER_TEMP/freeiran-test-cores/fake-xray"
          cp "$RUNNER_TEMP/freeiran-test-cores/fakecore" "$RUNNER_TEMP/freeiran-test-cores/fake-v2ray"
          cp "$RUNNER_TEMP/freeiran-test-cores/fakecore" "$RUNNER_TEMP/freeiran-test-cores/fake-sing-box"

      # v0.11.0 repair: ./tools/... is now REALLY in the matrix. The
      # v0.10.5 changelog claimed "CI vet/test coverage extended to
      # ./tools/... so the scanner's regression suite runs on the
      # Linux gate" — but the workflow never included it, so
      # tools/gosecscan's tests ran nowhere in CI. The gosecscan
      # suite is the regression guard for the comment-aware security
      # scanning; it must run on every push.
      - name: Vet
        run: go vet ./engine/... ./system/... ./internal/... ./tools/...

      - name: Build engine packages
        run: go build ./engine/... ./system/... ./internal/... ./tools/...

      - name: Test
        run: go test -count=1 ./engine/... ./system/... ./internal/... ./tools/...
        env:
          FREEIRAN_TEST_CORES: ${{ runner.temp }}/freeiran-test-cores

      - name: Test (race)
        run: go test -race -count=1 ./engine/... ./system/... ./internal/...
        env:
          FREEIRAN_TEST_CORES: ${{ runner.temp }}/freeiran-test-cores

      - name: Benchmarks (smoke)
        run: |
          go test -bench=. -benchtime=1x -run=NONE \
            ./engine/chunks ./engine/store ./engine/pipeline \
            ./engine/core ./engine/core/v2ray ./internal/logging

      # Compile-validate the Wails desktop app for the primary target
      # from Linux: the Windows webview needs no GTK, so a full
      # windows/amd64 build succeeds without GUI development packages.
      - name: Validate desktop build (windows/amd64)
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -o /dev/null ./cmd/freeiran

  native:
    name: C++ native layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and test native library
        run: make -C native test

      - name: Build with acceleration (native_accel)
        run: |
          make -C native
          go build -tags native_accel ./engine/native

      - name: Cross-language tests with acceleration
        run: |
          CGO_ENABLED=1 go test -tags native_accel -count=1 \
            ./engine/native

      - name: Benchmark native bridge
        run: |
          # -bench=. (v0.9.4): the previous -bench=Native filter matched
          # no benchmark name (BenchmarkHashBatch / BenchmarkScanURLs /
          # sub-benchmark "native" differ in case), so this step ran
          # zero benchmarks silently.
          CGO_ENABLED=1 go test -tags native_accel -bench=. -benchtime=1x \
            -run=NONE ./engine/native

  frontend:
    name: TypeScript frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # The committed embed output must be EXACTLY what the pinned
      # toolchain regenerates: build:embed wipes and re-copies the
      # target, so a clean `git diff` proves no stale bundles and no
      # drift between frontend/dist and cmd/freeiran/frontend/dist.
      #
      # PATH CONTEXT (fixed in v0.9.9): npm steps run in frontend/ but
      # the embed tree lives at the REPO ROOT (cmd/freeiran/frontend/
      # dist). The check below therefore runs from the repository root
      # and only the npm invocation is scoped to frontend/ — running
      # the whole script under the job's `working-directory: frontend`
      # default made every root-relative path resolve to the
      # nonexistent frontend/cmd/... tree (CI run 35542123824) and the
      # `git diff -- <path>` guard passed vacuously because a
      # nonexistent pathspec never produces a diff.
      #
      # The inventory assertions live in frontend/scripts/
      # embed-inventory.mjs — the ONE shared validation source (the
      # same module copy-dist.mjs validates with) — invoked here via
      # validate-embed.mjs. An old hashed artifact, a missing canonical
      # asset, an undeclared index.html reference or a duplicate worker
      # fails the job even when git diff would stay quiet (e.g. a file
      # introduced AND committed in the same change).
      - name: Clean-room embed check
        working-directory: .
        run: |
          (cd frontend && npm run build:embed)

          if ! git diff --exit-code -- cmd/freeiran/frontend/dist; then
            echo "cmd/freeiran/frontend/dist is stale: the committed embed" >&2
            echo "output differs from a fresh build. Run 'npm run build:embed'" >&2
            echo "and commit the result (copy-dist.mjs wipes stale hashed files)." >&2
            git status --short -- cmd/freeiran/frontend/dist
            exit 1
          fi

          node frontend/scripts/validate-embed.mjs

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  protocol-cores:
    name: Protocol cores (real binaries)
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache: true

      # The adapter contract tests run in the go job with the fake
      # core stand-in. THIS job installs the pinned real protocol
      # cores (version + SHA-256 verified, official sources only) and
      # runs the smoke suites: the cores' own config validators
      # (v2ray test / xray run -test / sing-box check) plus a full
      # startup + listener-ready + shutdown cycle for every
      # supported protocol. No public proxy server is contacted.
      - name: Install pinned V2Ray Core (v2fly)
        run: |
          # Checksums below are the SHA-256 of the OFFICIAL release
          # assets as published (re-verified against the downloaded
          # archives; the v0.4.0 workflow pinned incorrect values which
          # made this job fail even with a valid YAML file).
          curl -sSL -o /tmp/v2ray.zip \
            "https://github.com/v2fly/v2ray-core/releases/download/v5.53.0/v2ray-linux-64.zip"
          echo "6bbb8aee65a57d0b12599b4b7c842b3ad0daca4436e661d94015c447cb31b4fa  /tmp/v2ray.zip" | sha256sum -c -
          mkdir -p .cores && unzip -oq /tmp/v2ray.zip -d .cores/v2ray

      - name: Install pinned Xray Core
        run: |
          curl -sSL -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip"
          echo "23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  /tmp/xray.zip" | sha256sum -c -
          unzip -oq /tmp/xray.zip -d .cores/xray

      - name: Install pinned sing-box
        run: |
          curl -sSL -o /tmp/singbox.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-linux-amd64.tar.gz"
          echo "2375de6999f4f56ab46b4fc5ddf26a6aba1d3e61a0f4e7ddec2f4690457d5f63  /tmp/singbox.tar.gz" | sha256sum -c -
          tar -xzf /tmp/singbox.tar.gz -C .cores
          mv .cores/sing-box-1.14.0-linux-amd64/sing-box .cores/sing-box-bin

      - name: Verify core binaries report their versions
        run: |
          ./.cores/v2ray/v2ray version
          ./.cores/xray/xray version
          ./.cores/sing-box-bin version

      - name: V2Ray adapter smoke tests (real core)
        run: go test -count=1 -run TestV2RaySmokeRealBinary -v ./engine/core/v2ray
        env:
          FREEIRAN_TEST_V2RAY_BIN: ${{ github.workspace }}/.cores/v2ray/v2ray

      - name: Xray adapter smoke tests (real core)
        run: go test -count=1 -run TestXraySmokeRealBinary -v ./engine/core/xray
        env:
          FREEIRAN_TEST_XRAY_BIN: ${{ github.workspace }}/.cores/xray/xray

      - name: sing-box adapter smoke tests (real core)
        run: go test -count=1 -run TestSingBoxSmokeRealBinary -v ./engine/core/singbox
        env:
          FREEIRAN_TEST_SINGBOX_BIN: ${{ github.workspace }}/.cores/sing-box-bin

  windows:
    name: Windows tests and desktop build
    runs-on: windows-latest
    needs: [go, frontend]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (and stage embed assets)
        run: |
          npm ci
          npm run build:embed
        working-directory: frontend

      # Deterministic test fixtures: the full test matrix runs against
      # controlled fake protocol-core executables built from
      # engine/core/testdata/fakecore — NEVER real VPN binaries and
      # never whatever happens to be installed on the runner. The
      # fixture directory is exposed through FREEIRAN_TEST_CORES and a
      # missing fixture fails the tests loudly instead of skipping.
      #
      # The Windows job does NOT depend on the protocol-cores job: the
      # fake-core matrix is self-contained. Real-binary verification
      # runs independently in the protocol-cores job and gates releases
      # through release.yml.
      - name: Build deterministic fake test cores
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\freeiran-test-cores" | Out-Null
          go build -o "$env:RUNNER_TEMP\freeiran-test-cores\fakecore.exe" ./engine/core/testdata/fakecore
          Copy-Item "$env:RUNNER_TEMP\freeiran-test-cores\fakecore.exe" "$env:RUNNER_TEMP\freeiran-test-cores\fake-xray.exe"
          Copy-Item "$env:RUNNER_TEMP\freeiran-test-cores\fakecore.exe" "$env:RUNNER_TEMP\freeiran-test-cores\fake-v2ray.exe"
          Copy-Item "$env:RUNNER_TEMP\freeiran-test-cores\fakecore.exe" "$env:RUNNER_TEMP\freeiran-test-cores\fake-sing-box.exe"

      # ============================================================
      # v0.11.0 — the two-layer Windows proof.
      #
      # MEASUREMENT FIRST (docs/performance.md carries the numbers):
      # the v0.10.5 full matrix (`go test -count=1 -p 1 ./...`) spent
      # its Windows time on platform-NEUTRAL suites the Linux `go`
      # job already executes — and executes again under -race:
      # connection 42s, testqueue 31s, provider 31s, app 30s,
      # coremgr 29s, netcheck 15s on Linux, each multiplied by the
      # Windows runner's process-spawn and I/O overhead and
      # serialized by -p 1. The Windows-ONLY code paths (WinINet ABI
      # round-trips, process/job supervision, exec hidden-console,
      # PE/GUI subsystem, file-handle deletion semantics) are a small
      # fraction of that time.
      #
      # The Linux full suite (plus -race) remains the platform-neutral
      # behavioral authority. Windows proves what ONLY Windows can
      # prove:
      #
      #   Layer A — the COMPLETE Windows test surface COMPILES and
      #   links (every package, every test binary, including the
      #   //go:build windows files Linux never compiles).
      #
      #   Layer B — the Windows-SENSITIVE behavior executes: real
      #   WinINet round-trips, crash/boot recovery against the real
      #   proxy backend, process/job supervision, executable
      #   resolution, store file-handle lifecycle, httpx
      #   finalization (the v0.9.6 read-only Sync asymmetry),
      #   connection process lifecycle incl. image release, and the
      #   netcheck diagnostics ladder on the Windows stack.
      #
      #   Layer C — the critical WinINet/recovery set runs FIVE
      #   times (flakiness detector, unchanged from v0.10.3+).
      #
      # Nothing that ran on Windows before is silently gone: Layer A
      # compiles it all, the platform-neutral BEHAVIOR it duplicates
      # is still proven — on Linux, under race — and every package
      # with a documented Windows-specific defect history (store,
      # httpx, system, tunnel, app, connection, coremgr, netcheck,
      # cmd) still EXECUTES its Windows-relevant tests here.
      # ============================================================

      # Layer A — compile the complete Windows test surface.
      #
      # -run '^$' compiles and links EVERY test binary (and runs each
      # TestMain — provider's fixture build included, which also
      # proves the faketor/fakepsiphon fixtures compile for Windows)
      # without executing the platform-neutral test bodies again.
      # A compile error in any //go:build windows test file — files
      # the Linux job never compiles — fails here loudly.
      - name: Windows compile-all (complete test surface)
        run: go test -run '^$' -count=1 -p 1 -timeout=10m ./...
        env:
          CGO_ENABLED: "0"
          FREEIRAN_TEST_CORES: ${{ runner.temp }}\freeiran-test-cores

      # Layer B (1/2) — platform-critical packages, FULL suites.
      #
      # These four packages run every test they have on Windows
      # because their Windows behavior IS the point:
      #   engine/tunnel   — real WinINet ABI round-trips + recovery
      #                      machinery against the real backend
      #                      (the windows-tagged battery plus the
      #                      cross-platform algebra/controller tests).
      #   system          — process/job supervision (hidden console,
      #                      job objects, grandchild cleanup, the
      #                      cmd.exe PATH resolver), workspace file
      #                      lifecycle, executable discovery with
      #                      Windows path semantics.
      #   engine/store    — file lifecycle on the platform where an
      #                      open handle blocks deletion (the
      #                      documented v0.3.0 defect class).
      #   internal/httpx  — finalization semantics (the v0.9.6
      #                      read-only-open + Sync asymmetry that
      #                      ONLY Windows exhibits).
      #
      # -p 1: these suites mutate machine-global state (WinINet,
      # console/process supervision) and must not overlap.
      - name: Windows behavioral tests (platform-critical packages)
        run: go test -count=1 -p 1 -timeout=10m ./engine/tunnel/ ./system/ ./engine/store/ ./internal/httpx/
        env:
          CGO_ENABLED: "0"
          FREEIRAN_TEST_CORES: ${{ runner.temp }}\freeiran-test-cores

      # Layer B (2/2) — targeted Windows-sensitive behavioral tests.
      #
      # Focused -run patterns instead of whole packages: the
      # platform-neutral remainder of these packages (queue logic,
      # ranking math, provider scripting, URL parsing, publish
      # ordering...) is already proven by the Linux job's full suite
      # + race run; re-running it on Windows buys no new evidence.
      # What runs here is the Windows-material surface:
      #   coremgr      — hidden-console flags + graceful stop of a
      #                  real child (exec_windows_test.go).
      #   netcheck     — the environment/staged-diagnostics ladder
      #                  and classification on the Windows network
      #                  stack, plus the privilege-gated traceroute
      #                  guard.
      #   app          — boot/shutdown lifecycle, boot phases, and
      #                  the crash-recovery boots against the REAL
      #                  WinINet backend (v0101 tests).
      #   connection   — process supervision lifecycle paths that
      #                  materially differ on Windows: hung-core
      #                  teardown with image release (os.Remove only
      #                  succeeds after handle release on Windows),
      #                  mid-session crash transitions, cancel/deadline
      #                  survival, reconnect process replacement,
      #                  goroutine-leak cycles, provider sessions.
      - name: Windows behavioral tests (targeted)
        run: |
          go test -count=1 -p 1 -timeout=4m -run 'TestApplyHiddenConsole.*|TestGracefulStopTerminatesChild' ./engine/coremgr/
          go test -count=1 -p 1 -timeout=4m -run 'TestEnvironment|TestStaged|TestFirstFailedStageOrder|TestClassificationLogic|TestRunOfflineClassifiesNoInternet|TestToolTracerouteUnsupported' ./engine/netcheck/
          go test -count=1 -p 1 -timeout=6m -run 'TestAppBoots.*|TestAppShutdown.*|TestBootPhase.*|TestUserGroupLifecycle' ./engine/app/
          go test -count=1 -p 1 -timeout=8m -run 'TestHungCore|TestMidSessionCrash|TestStabilityTeardown|TestConnectSurvives|TestReconnectReplaces|TestOperationCancelledDuringStartup|TestCrashEndsSession|TestConnectDisconnectCycles|TestProviderSessionSurvives|TestProviderSessionReplaces|TestUserPortOccupied' ./engine/connection/
        env:
          CGO_ENABLED: "0"
          FREEIRAN_TEST_CORES: ${{ runner.temp }}\freeiran-test-cores

      # Layer C — the repeated crash-recovery battery (v0.10.3
      # design, unchanged scope): the WinINet round-trips, recovery
      # markers, stale recovery and app crash-boots run FIVE times
      # (-count=5) as a flakiness detector. It runs EVEN WHEN a
      # Layer A/B step failed (if: always()) — a failing run must
      # never hide the repeated evidence, and five repetitions of a
      # Layer-B failure distinguish a deterministic defect from a
      # race. -v was dropped in v0.11.0: failures print their full
      # diagnostic output regardless, and 5× verbose passes buried
      # the signal; the WinINet tests dump per-field proxy state
      # (dumpProxyState) on FAILURE, which is where it matters.
      # -p 1: the two packages mutate machine-global WinINet state
      # and must never overlap.
      - name: Crash-recovery regression battery (repeated, always runs)
        if: always()
        run: go test -count=5 -p 1 -timeout=10m -run "TestAppBootsAfterCrashedProxySession|TestAppBootsWithoutProxyResidue|TestRecoverStaleProxy.*|TestRecoveryMarker.*|TestEnable.*|TestDisable.*|TestWinINet.*" ./engine/tunnel/ ./engine/app/
        env:
          CGO_ENABLED: "0"

      - name: Runtime smoke test
        if: always()
        shell: pwsh
        # Headless application smoke test: boot the engine, verify the
        # service surface, shut down. The webview itself is not launched
        # (no interactive session guarantees on runners); the engine
        # startup/shutdown path is what the smoke test guards. The smoke
        # test is fully deterministic (no network, no real core, no
        # scheduler activity) so it always reaches the same exit code.
        run: |
          go run ./cmd/freeiran --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed: $LASTEXITCODE" }

      - name: Build desktop application
        shell: pwsh
        # NOTE: a step may declare only ONE env mapping. The v0.3.0/v0.4.0
        # workflow accidentally declared two `env:` keys here (VERSION at
        # the top, CGO_ENABLED after `run:`). Duplicate mapping keys make
        # the whole workflow file invalid YAML, so GitHub Actions refused
        # to start ANY job and every CI run failed instantly with zero
        # jobs. All env vars are merged into a single mapping.
        #
        # The version stamp is read from the VERSION file (single source
        # of truth) instead of being hard-coded per release.
        env:
          CGO_ENABLED: "0"
        run: |
          $version = (Get-Content VERSION -Raw).Trim() + "-ci"
          $commit = $env:GITHUB_SHA.Substring(0, 8)

          # -H=windowsgui (v0.9.2): even CI dev builds must be
          # GUI-subsystem executables — a console-subsystem binary
          # opens a visible CMD window on double-click.
          go build -trimpath `
            -ldflags "-s -w -H=windowsgui -X github.com/Parsaetak/FreeIran/internal/version.Version=$version -X github.com/Parsaetak/FreeIran/internal/version.Commit=$commit" `
            -o FreeIran-windows-amd64.exe ./cmd/freeiran

      - name: Verify executable
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          FREEIRAN_GUI_EXE: ${{ github.workspace }}\FreeIran-windows-amd64.exe
        run: |
          $file = "FreeIran-windows-amd64.exe"
          if (-not (Test-Path $file)) { throw "executable missing" }
          $size = (Get-Item $file).Length
          if ($size -lt 10MB) { throw "executable suspiciously small: $size" }
          Write-Host "Built $file ($([math]::Round($size/1MB,1)) MB)"

          # v0.9.2 regression check: the PE header must declare the
          # WINDOWS_GUI subsystem so double-clicking never opens a CMD
          # window (TestWindowsGUISubsystem reads the built binary).
          go test -count=1 -run TestWindowsGUISubsystem ./cmd/freeiran
          if ($LASTEXITCODE -ne 0) { throw "PE subsystem check failed: console-subsystem binary detected" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: FreeIran-windows-amd64
          path: FreeIran-windows-amd64.exe
          retention-days: 7
