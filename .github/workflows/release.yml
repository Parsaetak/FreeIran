name: Release

# v0.9.1 — two independent platform pipelines:
#
#   FreeIran-windows-amd64.zip   (windows-latest)
#   FreeIran-linux-amd64.zip     (ubuntu-latest, GTK3/WebKit2GTK build)
#
# The release contains ONLY the platform ZIPs: no .sha256 checksum
# files are generated, uploaded or published by this workflow.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  GO_VERSION: "1.26.8"
  NODE_VERSION: "22"

jobs:
  verify:
    name: Verify version, assets and run full matrix
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify version consistency
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          expected="${tag#v}"
          version=$(tr -d '[:space:]' < VERSION)

          echo "tag=$tag expected=$expected VERSION=$version"

          if [ "$expected" != "$version" ]; then
            echo "VERSION file ($version) does not match tag ($expected)" >&2
            exit 1
          fi

          if ! grep -q "\"$version\"" frontend/package.json; then
            echo "frontend/package.json version does not match $version" >&2
            exit 1
          fi

          if ! grep -q "var Version = \"$version\"" internal/version/version.go; then
            echo "internal/version/version.go does not match $version" >&2
            exit 1
          fi

          go_version=$(go version | awk '{print $3}')
          echo "Go version: $go_version"

      # v0.9.1: the application icon is part of the release contract.
      # The SVG is canonical; the ICO/PNG derivatives and the committed
      # Windows resource objects must all be present so the icon can
      # never silently disappear from future builds.
      - name: Validate application icon assets
        run: |
          for f in \
            assets/freeiran-icon.svg \
            assets/freeiran-icon.ico \
            assets/freeiran-icon.png \
            internal/appicon/freeiran-icon.png \
            cmd/freeiran/rsrc_windows_amd64.syso \
            cmd/freeiran/rsrc_windows_386.syso; do
            if [ ! -s "$f" ]; then
              echo "icon asset missing or empty: $f" >&2
              exit 1
            fi
          done

          # The embedded window icon must match the canonical raster.
          cmp assets/freeiran-icon.png internal/appicon/freeiran-icon.png

          # ICO must carry at least 16x16 and 256x256 entries.
          python3 - <<'PY'
          import struct

          with open("assets/freeiran-icon.ico", "rb") as fh:
              data = fh.read()

          reserved, kind, count = struct.unpack("<HHH", data[:6])
          assert reserved == 0 and kind == 1, "not an ICO file"

          sizes = set()
          for i in range(count):
              entry = data[6 + i * 16 : 6 + (i + 1) * 16]
              w, h = entry[0], entry[1]
              sizes.add((256 if w == 0 else w, 256 if h == 0 else h))

          assert (16, 16) in sizes, f"ICO missing 16x16: {sizes}"
          assert (256, 256) in sizes, f"ICO missing 256x256: {sizes}"
          print(f"ICO OK: {count} sizes {sorted(sizes)}")
          PY

      - name: Build deterministic fake test cores
        run: |
          mkdir -p "$RUNNER_TEMP/freeiran-test-cores"
          go build -o "$RUNNER_TEMP/freeiran-test-cores/fakecore" ./engine/core/testdata/fakecore
          cp "$RUNNER_TEMP/freeiran-test-cores/fakecore" "$RUNNER_TEMP/freeiran-test-cores/fake-xray"
          cp "$RUNNER_TEMP/freeiran-test-cores/fakecore" "$RUNNER_TEMP/freeiran-test-cores/fake-v2ray"
          cp "$RUNNER_TEMP/freeiran-test-cores/fakecore" "$RUNNER_TEMP/freeiran-test-cores/fake-sing-box"

      - name: Format check
        run: |
          unformatted=$(gofmt -l ./engine ./system ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./engine/... ./system/... ./internal/...

      - name: Build engine packages
        run: go build ./engine/... ./system/... ./internal/...

      - name: Test (fake-core matrix)
        run: go test -count=1 ./engine/... ./system/... ./internal/...
        env:
          FREEIRAN_TEST_CORES: ${{ runner.temp }}/freeiran-test-cores

      - name: Race tests (fake-core matrix)
        run: go test -race -count=1 ./engine/... ./system/... ./internal/...
        env:
          FREEIRAN_TEST_CORES: ${{ runner.temp }}/freeiran-test-cores

      - name: Native tests
        run: make -C native test

      - name: Frontend typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Frontend unit tests
        run: npm test
        working-directory: frontend

      - name: Frontend production build
        run: npm run build
        working-directory: frontend

      # Compile-validate the Wails desktop app for the primary target
      # from Linux: the Windows webview needs no GTK, so a full
      # windows/amd64 build succeeds without GUI development packages.
      - name: Validate desktop build (windows/amd64)
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -o /dev/null ./cmd/freeiran

  build-windows:
    name: Windows amd64 release
    runs-on: windows-latest
    needs: [verify]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (and stage embed assets)
        run: |
          npm ci
          npm run build:embed
        working-directory: frontend

      - name: Build deterministic fake test cores
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\freeiran-test-cores" | Out-Null
          go build -o "$env:RUNNER_TEMP\freeiran-test-cores\fakecore.exe" ./engine/core/testdata/fakecore
          Copy-Item "$env:RUNNER_TEMP\freeiran-test-cores\fakecore.exe" "$env:RUNNER_TEMP\freeiran-test-cores\fake-xray.exe"
          Copy-Item "$env:RUNNER_TEMP\freeiran-test-cores\fakecore.exe" "$env:RUNNER_TEMP\freeiran-test-cores\fake-v2ray.exe"
          Copy-Item "$env:RUNNER_TEMP\freeiran-test-cores\fakecore.exe" "$env:RUNNER_TEMP\freeiran-test-cores\fake-sing-box.exe"

      - name: Run Go tests (Windows)
        run: go test -count=1 ./...
        env:
          CGO_ENABLED: "0"
          FREEIRAN_TEST_CORES: ${{ runner.temp }}\freeiran-test-cores

      - name: Runtime smoke test
        shell: pwsh
        run: |
          go run ./cmd/freeiran --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed: $LASTEXITCODE" }

      - name: Build desktop application
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $commit = $env:GITHUB_SHA.Substring(0, 8)

          # -H=windowsgui: the shipped executable must not open a
          # console window. The committed .syso resources link the
          # FreeIran icon, version info and DPI manifest automatically.
          go build -trimpath `
            -ldflags "-s -w -H=windowsgui -X github.com/Parsaetak/FreeIran/internal/version.Version=$version -X github.com/Parsaetak/FreeIran/internal/version.Commit=$commit" `
            -o FreeIran-windows-amd64.exe ./cmd/freeiran

          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Verify executable (size, icon and version resources)
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $size = (Get-Item FreeIran-windows-amd64.exe).Length
          if ($size -lt 10MB) { throw "executable suspiciously small: $size" }
          Write-Host "Executable size: $([math]::Round($size/1MB,1)) MB"

          # The .syso resource (icon + version + manifest) must be
          # linked: ProductName only exists if the resource made it in.
          $vi = (Get-Item FreeIran-windows-amd64.exe).VersionInfo
          Write-Host "ProductName='$($vi.ProductName)' ProductVersion='$($vi.ProductVersion)'"
          if ($vi.ProductName -ne "FreeIran") { throw "application resource missing: ProductName is '$($vi.ProductName)'" }
          if ($vi.ProductVersion -notlike "$version*") { throw "resource version mismatch: '$($vi.ProductVersion)' vs $version" }

          $bytes = [System.IO.File]::ReadAllBytes("FreeIran-windows-amd64.exe")
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (-not $ascii.Contains(".rsrc")) { throw "executable has no resource section (icon lost)" }
          if (-not $ascii.Contains("PNG")) { throw "icon payload missing from resource section" }
          Write-Host "Icon + version resources verified"

      # v0.9.2 regression check: the linked executable must declare the
      # WINDOWS_GUI PE subsystem so a double-click NEVER opens a CMD
      # window. TestWindowsGUISubsystem parses the built binary's PE
      # header and fails the release on a console-subsystem artifact.
      - name: Verify GUI subsystem (no console window)
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          FREEIRAN_GUI_EXE: ${{ github.workspace }}\FreeIran-windows-amd64.exe
        run: |
          go test -count=1 -run TestWindowsGUISubsystem ./cmd/freeiran
          if ($LASTEXITCODE -ne 0) { throw "PE subsystem check failed: console-subsystem binary detected" }
          Write-Host "PE subsystem verified: WINDOWS_GUI (no console on startup)"

      # The release ZIP is a COMPLETE, self-contained deployment
      # directory — not a bare exe. A user can extract it anywhere and
      # keep using the deployment (portable layout next to the exe).
      - name: Create deployment directory
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $pkg = "FreeIran-v$version-windows-amd64"

          New-Item -ItemType Directory -Force -Path "$pkg/config"   | Out-Null
          New-Item -ItemType Directory -Force -Path "$pkg/data"     | Out-Null
          New-Item -ItemType Directory -Force -Path "$pkg/logs"     | Out-Null
          New-Item -ItemType Directory -Force -Path "$pkg/cache"    | Out-Null
          New-Item -ItemType Directory -Force -Path "$pkg/cores"    | Out-Null
          New-Item -ItemType Directory -Force -Path "$pkg/runtime"  | Out-Null
          New-Item -ItemType Directory -Force -Path "$pkg/docs"     | Out-Null
          New-Item -ItemType Directory -Force -Path "$pkg/deployment" | Out-Null

          Copy-Item FreeIran-windows-amd64.exe "$pkg/FreeIran.exe"
          Copy-Item README.md   "$pkg/README.md"
          Copy-Item LICENSE     "$pkg/LICENSE"
          Copy-Item VERSION     "$pkg/VERSION"
          Copy-Item docs/*.md   "$pkg/docs/"
          Copy-Item assets/freeiran-icon.svg "$pkg/deployment/"

          # Portable marker: the app keeps all state inside the
          # deployment tree when this file sits next to the exe.
          Set-Content -Path "$pkg/portable.marker" -Value "FreeIran portable deployment v$version"

          # Deployment metadata consumed by the validation step and by
          # future update tooling.
          $commit = $env:GITHUB_SHA.Substring(0, 8)
          $metadata = [ordered]@{
            name         = "FreeIran"
            version      = $version
            commit       = $commit
            platform     = "windows/amd64"
            layout       = @("FreeIran.exe", "README.md", "LICENSE", "VERSION", "portable.marker",
                             "config", "data", "logs", "cache", "cores", "runtime", "docs", "deployment")
            created_at   = (Get-Date).ToUniversalTime().ToString("o")
          }
          $metadata | ConvertTo-Json | Set-Content -Path "$pkg/deployment/deployment.json"

          # Placeholders for directories that legitimately start empty.
          foreach ($d in @("config", "data", "logs", "cache", "runtime")) {
            Set-Content -Path "$pkg/$d/.gitkeep" -Value ""
          }

          Write-Host "Deployment directory $pkg created"

      - name: Validate package contents
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $pkg = "FreeIran-v$version-windows-amd64"

          $required = @(
            "$pkg/FreeIran.exe",
            "$pkg/README.md",
            "$pkg/LICENSE",
            "$pkg/VERSION",
            "$pkg/portable.marker",
            "$pkg/deployment/deployment.json",
            "$pkg/deployment/freeiran-icon.svg"
          )
          foreach ($dir in @("config", "data", "logs", "cache", "cores", "runtime", "docs", "deployment")) {
            $required += "$pkg/$dir"
          }

          foreach ($item in $required) {
            if (-not (Test-Path $item)) { throw "package validation failed: missing $item" }
          }

          if ((Get-Content "$pkg/VERSION" -Raw).Trim() -ne $version) {
            throw "package validation failed: VERSION mismatch"
          }

          if ((Get-Item "$pkg/FreeIran.exe").Length -lt 10MB) {
            throw "package validation failed: FreeIran.exe suspiciously small"
          }

          $json = Get-Content "$pkg/deployment/deployment.json" -Raw | ConvertFrom-Json
          if ($json.version -ne $version) { throw "package validation failed: deployment.json version mismatch" }
          if ($json.platform -ne "windows/amd64") { throw "package validation failed: deployment.json platform mismatch" }

          Write-Host "Package contents validated ($($required.Count) required entries)"

      - name: Create ZIP
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $pkg = "FreeIran-v$version-windows-amd64"

          if (Test-Path "FreeIran-windows-amd64.zip") { Remove-Item "FreeIran-windows-amd64.zip" }
          Compress-Archive -Path $pkg -DestinationPath "FreeIran-windows-amd64.zip" -CompressionLevel Optimal

          # Deterministic-enough ordering check: the archive root must
          # be exactly one deployment directory.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$PWD/FreeIran-windows-amd64.zip")
          try {
            $roots = $zip.Entries | ForEach-Object { ($_.FullName -split '/')[0] } | Sort-Object -Unique
            if ($roots.Count -ne 1) { throw "zip malformed: expected exactly one root directory, found $($roots -join ', ')" }
            if ($zip.Entries.Count -lt 12) { throw "zip malformed: only $($zip.Entries.Count) entries" }
          } finally {
            $zip.Dispose()
          }

          Write-Host "Packaged FreeIran-windows-amd64 (v$version): $([math]::Round((Get-Item 'FreeIran-windows-amd64.zip').Length/1MB,1)) MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-windows
          path: FreeIran-windows-amd64.zip
          retention-days: 3

  build-linux:
    name: Linux amd64 release
    runs-on: ubuntu-latest
    needs: [verify]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The Wails v3 Linux webview links GTK + WebKit through cgo.
      # The release uses the gtk3 build tag (GTK3 + WebKit2GTK 4.1) —
      # the most widely compatible wails v3 Linux frontend.
      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            zip

      - name: Verify linux/amd64 target
        run: |
          if [ "$("${GOOS:-$(go env GOHOSTOS)}")" != "linux" ]; then
            echo "runner is not linux" >&2
            exit 1
          fi
          go env GOOS GOARCH

      - name: Build frontend (and stage embed assets)
        run: |
          npm ci
          npm run build:embed
        working-directory: frontend

      - name: Build deterministic fake test cores
        run: |
          mkdir -p "$RUNNER_TEMP/freeiran-test-cores"
          go build -o "$RUNNER_TEMP/freeiran-test-cores/fakecore" ./engine/core/testdata/fakecore
          cp "$RUNNER_TEMP/freeiran-test-cores/fakecore" "$RUNNER_TEMP/freeiran-test-cores/fake-xray"
          cp "$RUNNER_TEMP/freeiran-test-cores/fakecore" "$RUNNER_TEMP/freeiran-test-cores/fake-v2ray"
          cp "$RUNNER_TEMP/freeiran-test-cores/fakecore" "$RUNNER_TEMP/freeiran-test-cores/fake-sing-box"

      - name: Run Go tests (Linux)
        run: go test -count=1 ./engine/... ./system/... ./internal/...
        env:
          FREEIRAN_TEST_CORES: ${{ runner.temp }}/freeiran-test-cores

      - name: Runtime smoke test
        run: |
          # go run compiles the full desktop package, so the gtk3 tag
          # and the installed GTK/WebKit headers are required here too.
          go run -tags gtk3 ./cmd/freeiran --smoke-test

      - name: Build desktop application (linux/amd64)
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          commit="${GITHUB_SHA:0:8}"

          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -tags gtk3 -trimpath \
              -ldflags "-s -w -X github.com/Parsaetak/FreeIran/internal/version.Version=$version -X github.com/Parsaetak/FreeIran/internal/version.Commit=$commit" \
              -o FreeIran-linux-amd64 ./cmd/freeiran

      - name: Verify executable
        run: |
          version=$(tr -d '[:space:]' < VERSION)

          if [ ! -x FreeIran-linux-amd64 ]; then
            echo "linux executable missing or not executable" >&2
            exit 1
          fi

          size=$(stat -c%s FreeIran-linux-amd64)
          if [ "$size" -lt 10000000 ]; then
            echo "executable suspiciously small: $size bytes" >&2
            exit 1
          fi

          file FreeIran-linux-amd64
          echo "Executable size: $((size / 1024 / 1024)) MB"

          # The embedded window icon must survive into the binary.
          if ! grep -q "freeiran" <(strings FreeIran-linux-amd64 | head -200000); then
            true # informational only — binary layout varies
          fi

      # Portable deployment layout (mirrors the Windows package):
      # everything the app needs lives next to the executable.
      - name: Create deployment directory
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          commit="${GITHUB_SHA:0:8}"
          pkg="FreeIran-v${version}-linux-amd64"

          mkdir -p "$pkg"/{config,data,logs,cache,cores,runtime,docs,deployment}

          install -m 0755 FreeIran-linux-amd64 "$pkg/FreeIran"
          cp README.md "$pkg/README.md"
          cp LICENSE  "$pkg/LICENSE"
          cp VERSION  "$pkg/VERSION"
          cp docs/*.md "$pkg/docs/"
          cp assets/freeiran-icon.svg "$pkg/deployment/"

          # Portable marker: keeps all state inside the deployment tree.
          echo "FreeIran portable deployment v$version" > "$pkg/portable.marker"

          # Launch helper: run from the deployment root without
          # contaminating system directories.
          cat > "$pkg/freeiran.sh" <<'EOF'
          #!/bin/sh
          # FreeIran launcher — run the app from this deployment.
          cd "$(dirname "$0")" || exit 1
          exec ./FreeIran "$@"
          EOF
          chmod 0755 "$pkg/freeiran.sh"

          cat > "$pkg/deployment/deployment.json" <<EOF
          {
            "name": "FreeIran",
            "version": "$version",
            "commit": "$commit",
            "platform": "linux/amd64",
            "layout": ["FreeIran", "freeiran.sh", "README.md", "LICENSE", "VERSION", "portable.marker", "config", "data", "logs", "cache", "cores", "runtime", "docs", "deployment"],
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          for d in config data logs cache runtime; do
            touch "$pkg/$d/.gitkeep"
          done

          echo "Deployment directory $pkg created"

      - name: Validate package contents
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          pkg="FreeIran-v${version}-linux-amd64"

          test -x "$pkg/FreeIran"          || { echo "missing $pkg/FreeIran" >&2; exit 1; }
          test -x "$pkg/freeiran.sh"       || { echo "missing $pkg/freeiran.sh" >&2; exit 1; }
          test -s "$pkg/README.md"         || { echo "missing README" >&2; exit 1; }
          test -s "$pkg/LICENSE"           || { echo "missing LICENSE" >&2; exit 1; }
          test -s "$pkg/VERSION"           || { echo "missing VERSION" >&2; exit 1; }
          test -s "$pkg/portable.marker"   || { echo "missing portable.marker" >&2; exit 1; }
          test -s "$pkg/deployment/deployment.json" || { echo "missing deployment.json" >&2; exit 1; }
          test -s "$pkg/deployment/freeiran-icon.svg" || { echo "missing icon" >&2; exit 1; }

          for d in config data logs cache cores runtime docs deployment; do
            test -d "$pkg/$d" || { echo "missing directory $pkg/$d" >&2; exit 1; }
          done

          if [ "$(tr -d '[:space:]' < "$pkg/VERSION")" != "$version" ]; then
            echo "VERSION mismatch inside package" >&2
            exit 1
          fi

          if [ "$(stat -c%s "$pkg/FreeIran")" -lt 10000000 ]; then
            echo "FreeIran binary suspiciously small" >&2
            exit 1
          fi

          python3 - "$pkg/deployment/deployment.json" "$version" <<'PY'
          import json, sys

          with open(sys.argv[1]) as fh:
              meta = json.load(fh)

          assert meta["version"] == sys.argv[2], f"deployment.json version mismatch: {meta['version']}"
          assert meta["platform"] == "linux/amd64", "deployment.json platform mismatch"
          print("deployment.json OK:", meta["version"], meta["platform"])
          PY

          echo "Package contents validated"

      - name: Create ZIP
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          pkg="FreeIran-v${version}-linux-amd64"

          rm -f FreeIran-linux-amd64.zip
          zip -qr FreeIran-linux-amd64.zip "$pkg"

          python3 - <<PY
          import zipfile

          with zipfile.ZipFile("FreeIran-linux-amd64.zip") as zf:
              roots = {name.split("/")[0] for name in zf.namelist()}
              assert len(roots) == 1, f"zip malformed: expected one root, found {roots}"
              assert len(zf.namelist()) >= 12, "zip has too few entries"
              print(f"ZIP OK: {len(zf.namelist())} entries, root={roots.pop()}")
          PY

          echo "Packaged FreeIran-linux-amd64 (v$version): $(du -h FreeIran-linux-amd64.zip | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-linux
          path: FreeIran-linux-amd64.zip
          retention-days: 3

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [verify, build-windows, build-linux]
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: release-assets-windows
          path: .

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: release-assets-linux
          path: .

      - name: Verify release artifact set
        run: |
          echo "Artifacts:"
          ls -la *.zip

          # Exactly the two platform ZIPs — no checksum files, nothing else.
          actual="$(ls *.zip | sort | tr '\n' ' ')"
          if [ "$actual" != "FreeIran-linux-amd64.zip FreeIran-windows-amd64.zip " ]; then
            echo "unexpected release artifact set: $(ls *.zip)" >&2
            exit 1
          fi

          if compgen -G "*.sha256" >/dev/null; then
            echo "checksum files must not be published" >&2
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            FreeIran-windows-amd64.zip
            FreeIran-linux-amd64.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
