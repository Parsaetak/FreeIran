name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly vulnerability scan.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  vulnerabilities:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache: true

      # govulncheck is pinned (never @latest): tool upgrades are
      # deliberate changes reviewed together with go.mod. v1.8.0 is
      # compatible with the go1.26 toolchain; the version is also
      # documented in docs/security.md.
      - name: govulncheck — pure-Go engine packages (linux)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./engine/... ./system/... ./internal/...

      # The desktop entrypoint imports Wails v3, whose LINUX webview
      # requires GTK4/WebKitGTK CGO packages that are irrelevant to
      # this project's deployment target. Analysing it FOR WINDOWS —
      # the platform the app actually ships on — loads the pure-Go
      # WebView2 path and scans the real dependency surface. The scan
      # still fails on any detected vulnerability; nothing is muted.
      - name: govulncheck — desktop application (windows target)
        run: |
          GOOS=windows GOARCH=amd64 govulncheck ./cmd/...

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache: true

      - name: go vet (pure-Go packages)
        run: go vet ./engine/... ./system/... ./internal/...

      # cmd/freeiran compiles for windows without GTK dependencies, so
      # vet it against that target for full coverage.
      - name: go vet (desktop package, windows target)
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./cmd/...

      - name: Suspicious pattern scan (comment-aware, v0.10.5)
        run: |
          # Guard rails against accidental credential logging and
          # unsafe exec patterns in engine code. Every check below is
          # a REAL failure condition — nothing is silenced.
          #
          # v0.10.5 ROOT-CAUSE REPAIR: the previous raw-text greps
          # could not distinguish documentation from executable code
          # and failed on validate.go:105 — a protocol documentation
          # COMMENT describing the Hysteria2 URI form (obfs-password=
          # <pw>). The line-oriented comment filter used by the
          # child-process check had the inverse defect: inline
          # comments, non-star-prefixed block-comment interior lines
          # and raw-string lines starting with "//" confused it in
          # both directions (false positives AND false negatives).
          #
          # Both checks now go through tools/gosecscan, which
          # TOKENIZES each Go file with go/scanner and matches
          # patterns ONLY against non-comment token text:
          #   - documentation (line/block/inline comments) is
          #     structurally excluded — it can never trigger again;
          #   - every executable token is still scanned, INCLUDING
          #     verbatim string-literal contents — a real hardcoded
          #     credential still fails the job;
          #   - FAIL-CLOSED both ways: any pattern match exits 1, and
          #     a file that cannot be tokenized exits 2 (an
          #     unscannable file never passes silently). No
          #     allowlists, no '|| true', no continue-on-error.

          # -- Check 1: shell-injection surface (exec via sh -c). --
          # The pattern is spacing-tolerant (the old raw grep matched only
          # ONE exact source spelling), and comment-aware, so protocol
          # documentation that MENTIONS the call shape cannot trigger.
          sh_c_files=$(find ./engine ./system -name '*.go' -type f ! -name '*_test.go' | sort)
          if [ -z "$sh_c_files" ]; then
            echo "suspicious-pattern scan: no files found — refusing to pass vacuously" >&2
            exit 1
          fi
          # shellcheck disable=SC2086
          sh_c_out=$(go run ./tools/gosecscan -e 'exec\.Command\(\s*"sh"\s*,\s*"-c"' $sh_c_files)
          sh_c_status=$?
          if [ "$sh_c_status" -ne 0 ]; then
            echo "$sh_c_out" >&2
            echo "Found sh -c exec pattern (shell injection surface)" >&2
            exit 1
          fi

          # -- Check 2: credential patterns in non-test product code. --
          # Documentation no longer triggers (comments are structurally
          # excluded); an executable password=/secret= literal still
          # fails exactly as before. The REDACT exclusion is gone: it
          # was a textual pre-filter of the same fragile class.
          cred_files=$(find ./engine ./system -name '*.go' -type f ! -name '*_test.go' | sort)
          if [ -z "$cred_files" ]; then
            echo "suspicious-pattern scan: no files found — refusing to pass vacuously" >&2
            exit 1
          fi
          # shellcheck disable=SC2086
          cred_out=$(go run ./tools/gosecscan -i -e 'password=' -e 'secret=' $cred_files)
          cred_status=$?
          if [ "$cred_status" -ne 0 ]; then
            echo "$cred_out" >&2
            echo "Potential hardcoded credentials found (see above)" >&2
            exit 1
          fi

          echo "Pattern scan clean (comment-aware tokenizing scan)."

      # v0.9.8.6: allowlist-based audit of the REAL Windows/child
      # command surface. The product code (engine/, system/,
      # internal/, cmd/ — excluding *_test.go and the contract test
      # fixture builder) must not invoke privileged system shells or
      # download/exec tools. The v0.9.8.5 TUN backend used raw
      # curl/PowerShell/netsh/route — that surface was REMOVED with it
      # (engine/tunnel/tun_unavailable.go). Every future exception
      # must be added to the allowlist BELOW with a justification;
      # the scan is never weakened to make CI green.
      - name: Dangerous child-process surface (allowlist)
        run: |
          # The allowlist is EMPTY by design (v0.9.8.6): after the TUN
          # backend removal the product command surface contains no
          # justified exceptions. When a future, reviewed exception is
          # genuinely required, express it as an explicit `case` below
          # with the justification inline — never by weakening the
          # pattern set.
          #
          # Current intentional skips (documented, bounded):
          #   - *_test.go            — tests may assert on error text
          #   - engine/core/contract/ — the deterministic fake-test-core
          #                            builder runs `go build` (test-only
          #                            package, never linked into product
          #                            binaries)
          #   - system/resolve_windows.go — JUSTIFIED EXCEPTION: the
          #                            validated cmd.exe PATH RESOLVER.
          #                            It never executes anything; it
          #                            maps the bare name to a validated
          #                            absolute path (%COMSPEC% checked
          #                            to actually BE cmd.exe + on-disk
          #                            validation, System32 fallback) so
          #                            tests never depend on PATH/CWD.
          #                            Removal of this entry requires
          #                            removing the resolver first.

          PATTERNS='powershell|pwsh|invoke-webrequest|iwr |start-process|expand-archive|netsh|route add|route delete|bitsadmin|certutil|mshta|curl |wget |cmd /c|cmd\.exe'

          # v0.10.5: comment handling moved from the line-oriented
          # grep -vE '^(//|/\*|\*)' filter (inline comments, block-
          # comment interiors and raw-string lines starting with //
          # confused it) to the same structural tokenization as the
          # credential scan above: gosecscan drops comments at the
          # TOKEN level and keeps original line numbers for the
          # file:line reports. The allowlist below is unchanged.
          files=()
          while IFS= read -r file; do
            case "$file" in *_test.go) continue;; esac
            # The contract package builds the deterministic fake test
            # core through the go toolchain — justified, test-only.
            case "$file" in engine/core/contract/*) continue;; esac
            case "$file" in ./system/resolve_windows.go) continue;; esac
            files+=("$file")
          done < <(find ./engine ./system ./internal ./cmd -name '*.go' -type f)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "child-process scan: no files found — refusing to pass vacuously" >&2
            exit 1
          fi

          cp_out=$(go run ./tools/gosecscan -i -e "$PATTERNS" "${files[@]}")
          cp_status=$?
          if [ "$cp_status" -ne 0 ]; then
            echo "$cp_out" >&2
            echo "" >&2
            echo "Dangerous child-process patterns found (see file:line reports above)." >&2
            echo "Product code must not shell out to PowerShell/cmd/curl/wget/netsh/route" >&2
            echo "or archive-extraction commands. If a use is genuinely required, add a" >&2
            echo "JUSTIFIED entry to the allowlist in this workflow step and note it in" >&2
            echo "docs/security.md — do not weaken the pattern set." >&2
            exit 1
          fi

          echo "Dangerous child-process surface clean (0 violations)."
